name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic version tag to publish, including v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CODEX_OFFICIAL_SKILLS_ROOT: ${{ github.workspace }}/.official/codex/codex-rs/skills/src/assets/samples
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.version || github.ref }}
      - name: Check out pinned official validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/codex
          ref: 578c1b2230288104041e880a86d0f7f3a5ca6e47
          path: .official/codex
          persist-credentials: false
          sparse-checkout: |
            codex-rs/skills/src/assets/samples/plugin-creator
            codex-rs/skills/src/assets/samples/skill-creator
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install validator parser dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Resolve and verify tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $REQUESTED_TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$REQUESTED_TAG"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Refuse an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
      - name: Validate release candidate
        run: |
          python tools/validate_repository.py
          python tools/run_official_validators.py --require
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build deterministic archives, checksums, and SBOM
        run: python tools/build_release.py --version "${{ steps.release.outputs.version }}" --output dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-ai-game-studio-${{ steps.release.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Codex AI Game Studio $RELEASE_TAG"
