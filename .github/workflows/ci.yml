name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run repository contract validator
        run: python tools/validate_repository.py
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build deterministic artifacts
        run: python tools/build_release.py --version 1.0.0 --output dist
      - name: Upload Linux validation artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 7

  official-validators:
    name: Official Codex validators
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CODEX_OFFICIAL_SKILLS_ROOT: ${{ github.workspace }}/.official/codex/codex-rs/skills/src/assets/samples
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out pinned official validators
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openai/codex
          ref: 578c1b2230288104041e880a86d0f7f3a5ca6e47
          path: .official/codex
          persist-credentials: false
          sparse-checkout: |
            codex-rs/skills/src/assets/samples/plugin-creator
            codex-rs/skills/src/assets/samples/skill-creator
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install validator parser dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Run official plugin and skill validators
        run: python tools/run_official_validators.py --require

  pack-mocks:
    name: Pack ${{ matrix.pack }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pack: [unity, godot, unreal, blender, pixel]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Exercise confirmed setup and rollback with a mock server
        run: python tools/mock_pack_matrix.py --pack ${{ matrix.pack }}
