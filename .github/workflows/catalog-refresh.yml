name: Catalog metadata refresh

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-metadata-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh volatile GitHub metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Refresh review-only snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/refresh_catalog_metadata.py
      - name: Validate catalog and repository contracts
        run: |
          python plugins/ai-game-studio/scripts/ai_game_studio.py validate catalog plugins/ai-game-studio/catalog
          python tools/validate_repository.py
      - name: Open or update review pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/catalog-metadata-refresh
          delete-branch: true
          commit-message: "chore(catalog): refresh volatile GitHub metadata"
          title: "chore(catalog): weekly metadata refresh"
          body: |
            Automated review proposal for volatile GitHub metadata only.

            - Stable curation and license decisions are unchanged.
            - No catalog repository is downloaded, installed, or launched.
            - This workflow never pushes changes directly to `main`.
          labels: |
            catalog
            automated
          add-paths: plugins/ai-game-studio/catalog/snapshots/*.json
